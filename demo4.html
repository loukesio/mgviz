<!doctype html>
<html lang="en">
<head>

<title>demo4 · mgviz</title>
<style>
/* mgviz report — design tokens and components (see design_handoff_mgviz_report/README.md) */
:root {
  --bg: #f5f4ef; --panel: #ffffff; --fg: #1c201e; --muted: #636a66; --line: #d9dcd4; --line2: #eceee7;
  --accent: #1f5f8b; --hi: rgba(28,32,30,.04); --sel: rgba(28,32,30,.08); --abund: #2b5d86; --attn: #a84f2b;
  --svg-faint: #eef0ea; --svg-absent: #f0f1ec; --grey: #a3a8a4; --ink: #3b4440;
  --seq-lo: #dde6ee; --seq-hi: #0e3a62;
  --sans: -apple-system, "Segoe UI", system-ui, Helvetica, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow-pop: 0 8px 24px rgba(0,0,0,.14);
  --shadow-drawer: -12px 0 40px rgba(0,0,0,.14);
  --shadow-tip: 0 4px 14px rgba(0,0,0,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131615; --panel: #1b1f1d; --fg: #e4e6e0; --muted: #99a19b; --line: #2e3431; --line2: #242927;
    --accent: #8ec0e4; --hi: rgba(228,230,224,.05); --sel: rgba(228,230,224,.11); --abund: #8ec0e4; --attn: #f0957a;
    --svg-faint: #242927; --svg-absent: #222725; --grey: #6b7370; --ink: #c9cdc6;
    --seq-lo: #263645; --seq-hi: #a9d6ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131615; --panel: #1b1f1d; --fg: #e4e6e0; --muted: #99a19b; --line: #2e3431; --line2: #242927;
  --accent: #8ec0e4; --hi: rgba(228,230,224,.05); --sel: rgba(228,230,224,.11); --abund: #8ec0e4; --attn: #f0957a;
  --svg-faint: #242927; --svg-absent: #222725; --grey: #6b7370; --ink: #c9cdc6;
  --seq-lo: #263645; --seq-hi: #a9d6ff; color-scheme: dark;
}

html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 13px/1.45 var(--sans); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, select { font: inherit; color: inherit; }
a { color: var(--accent); } a:hover { color: var(--fg); }
svg text { user-select: none; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.textact { color: var(--accent); font-size: 12px; }
.textact:hover { text-decoration: underline; }

/* ---- header */
.app { min-height: 100vh; }
.hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding: 20px 28px 16px; border-bottom: 1px solid var(--line); }
.hdr-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.headline { font-family: var(--serif); font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -.01em; }
.subline { color: var(--muted); font-size: 13px; }
.hdr-actions { display: flex; align-items: center; gap: 14px; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; font-weight: 500; }
.btn:hover { border-color: var(--fg); }
.btn.sm { padding: 4px 10px; font-weight: 400; }
.btn.on { background: var(--sel); border-color: var(--fg); }
.btn.attn-on { background: var(--sel); border-color: var(--attn); }

/* ---- body layout */
.body { display: flex; align-items: flex-start; }
.focus { flex: none; width: 236px; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 18px 14px 40px 20px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--line); }
.main { flex: 1; min-width: 0; padding: 4px 28px 60px; }
@media (max-width: 760px) {
  .body { flex-direction: column; }
  .focus { width: 100%; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 4px 16px 40px; }
  .hdr { padding: 16px 16px 12px; }
}

/* ---- focus panel */
.sec { display: flex; flex-direction: column; gap: 1px; }
.sec.gap6 { gap: 6px; }
.sechead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 0 8px; }
.sechead-btn { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 0 8px 6px; width: 100%; }
.sechead-btn:hover { color: var(--fg); }
.sechead-btn .caret { width: 12px; font-size: 12px; line-height: 1; color: var(--fg); flex: none; }
.sechead-btn .grow { flex: 1; }
.sechead-btn .note { text-transform: none; letter-spacing: 0; font-weight: 400; }
.input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font-size: 12px; outline: none; width: 100%; }
.input.small { margin: 4px 0; padding: 5px 9px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 5px; width: 100%; align-items: center; }
.row:hover { background: var(--hi); }
.row.on { background: var(--sel); font-weight: 600; }
.row.sub { padding: 4px 8px 4px 24px; }
.row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name.mono { font-family: var(--mono); font-size: 11.5px; }
.row .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.typehead { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); padding: 7px 8px 3px; width: 100%; }
.typehead:hover { color: var(--fg); }
.typehead .caret { width: 12px; font-size: 12px; line-height: 1; color: var(--fg); flex: none; }
.typehead .grow { flex: 1; }
.linkrow { padding: 4px 8px 4px 24px; font-size: 11.5px; color: var(--accent); }
.seg4 { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg4 button { padding: 5px 0; text-align: center; font-size: 11px; color: var(--muted); }
.seg4 button.on { background: var(--fg); color: var(--panel); }
.rule { font-size: 11px; color: var(--muted); padding: 0 2px; text-wrap: pretty; }
.clear { font-size: 12px; color: var(--accent); text-decoration: underline; padding: 0 8px; }

/* ---- tabs */
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { padding: 14px 0 11px; font-size: 15px; font-weight: 400; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--fg); }
.tab.on { font-weight: 600; color: var(--fg); border-bottom-color: var(--fg); }
.tabrow { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin: 12px 0 18px; flex-wrap: wrap; }
.tabdesc { color: var(--muted); font-size: 13px; text-wrap: pretty; }
.focusline { font-size: 11.5px; font-family: var(--mono); }

/* ---- generic controls */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }
.toolbar.g14 { gap: 14px; }
.toolbar .lbl { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.toolbar .push { margin-left: auto; }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.segc button { padding: 4px 11px; color: var(--muted); border-left: 1px solid var(--line); background: var(--panel); }
.segc button:first-child { border-left: 0; }
.segc button.on { background: var(--fg); color: var(--panel); }
.segc.soft button.on { background: var(--sel); color: var(--fg); font-weight: 600; }
.segc.p12 button { padding: 5px 12px; }
.select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.exports { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 11.5px; font-weight: 400; flex: none; background: var(--panel); }
.exports button { padding: 3px 9px; border-left: 1px solid var(--line); }
.exports button:first-child { border-left: 0; }
.exports button:hover { background: var(--hi); }
.exports.md button { padding: 4px 10px; }
.iconbtn { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px; text-align: center; font-size: 15px; background: var(--panel); }
.iconbtn:hover { border-color: var(--fg); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.panel.pad { padding: 16px 18px; }
.ptitle { font-weight: 600; font-size: 14px; }
.story { font-family: var(--serif); font-size: 15px; line-height: 1.35; text-wrap: pretty; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.sm { font-size: 10.5px; padding: 0 7px; }
.pill.xs { font-size: 10.5px; padding: 0 6px; }
.pill.t0 { border-style: dashed; }
.pill.t2 { border-color: var(--fg); color: var(--fg); }
.pill.t3 { background: var(--fg); border-color: var(--fg); color: var(--panel); }
.badge { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 0 5px; border-radius: 3px; border: 1px solid var(--attn); color: var(--attn); cursor: help; font-family: var(--sans); white-space: nowrap; }
.empty { color: var(--muted); padding: 24px 0; }

/* ---- overview */
.ov-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.ov-search { position: relative; flex: 1; min-width: 260px; max-width: 560px; }
.ov-search input { width: 100%; padding: 9px 34px 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; outline: none; }
.ov-search .x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 16px; line-height: 1; color: var(--muted); padding: 2px 4px; }
.ov-search .x:hover { color: var(--fg); }
.ov-note { font-size: 12px; color: var(--muted); }
.ov-export { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card-name { font-family: var(--mono); font-size: 14.5px; font-weight: 600; }
.card-name:hover { text-decoration: underline; }
.card-type { font-size: 11px; color: var(--muted); }
.hits { display: flex; flex-direction: column; gap: 5px; }
.hits-lbl { font-size: 10.5px; color: var(--muted); }
.hit { display: flex; flex-direction: column; gap: 3px; width: 100%; padding: 3px 0; }
.hit:hover .hit-name { text-decoration: underline; }
.hit-name { font-size: 12.5px; text-wrap: pretty; }
.hit-row { display: flex; align-items: center; gap: 10px; }
.hit-bar { display: flex; align-items: center; gap: 6px; }
.hit-bar i { display: block; height: 6px; border-radius: 3px; background: var(--abund); }
.hit-bar span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.more { font-size: 11.5px; color: var(--muted); }
.qc { border-top: 1px solid var(--line2); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.qc-text { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.qc-bar { position: relative; height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; }
.qc-bar i { position: absolute; inset: 0 auto 0 0; display: block; }
.qc-bar .host { background: var(--line); }
.qc-bar .map { background: var(--fg); }
.glance { margin-bottom: 22px; overflow-x: auto; }
.glance-head { padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.glance-tbl { min-width: 820px; }
.grow5 { display: grid; grid-template-columns: 150px 90px 250px 130px minmax(200px, 1fr); gap: 0 14px; align-items: center; padding: 5px 18px; border-bottom: 1px solid var(--line2); }
.grow5:hover { background: var(--hi); }
.ghead { padding: 6px 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.ghead:hover { background: none; }
.ghead button { color: var(--muted); } .ghead button:hover, .ghead button.on { color: var(--fg); }
.gname { font-family: var(--mono); font-size: 12px; font-weight: 600; } .gname:hover { text-decoration: underline; }
.gtype { color: var(--muted); font-size: 12px; }
.gfrac { display: flex; align-items: center; gap: 8px; }
.gfrac .track { width: 100px; height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; flex: none; }
.gfrac .track i { display: block; height: 100%; background: var(--fg); opacity: .7; }
.gfrac .pct { font-family: var(--mono); font-size: 11.5px; }
.gfrac .of { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ghits { font-family: var(--mono); font-size: 12px; }
.gtop { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.gtop button { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .gtop button:hover { text-decoration: underline; }
.gtop span { color: var(--muted); font-size: 11.5px; flex: none; }
.showmore { padding: 10px 18px; color: var(--accent); font-size: 12.5px; }
.shared-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.shared-head .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.shared-note { font-size: 11.5px; color: var(--muted); }
.shared-cols { display: grid; grid-template-columns: 200px 76px 1fr; column-gap: 14px; font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.shared-cols .cells, .shared-row .cells { display: flex; gap: 4px; }
.shared-cols .cells span { flex: none; text-align: center; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shared-row { display: grid; grid-template-columns: 200px 76px 1fr; column-gap: 14px; align-items: center; padding: 2px 0; width: 100%; }
.shared-row:hover { background: var(--hi); }
.shared-row .vn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.shared-row .prev { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.shared-row .cell { flex: none; height: 16px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 9.5px; }

/* ---- detections table */
.tblbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.tblin { min-width: 1110px; padding-bottom: 120px; margin-bottom: -120px; }
.trow, .thead, .srow { display: grid; grid-template-columns: minmax(220px, 2fr) 100px 80px 150px 230px 160px 110px; gap: 0 14px; align-items: center; }
.thead { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.thead button { color: var(--muted); } .thead button:hover, .thead button.on { color: var(--fg); }
.thead button.right { text-align: right; }
.ghrow { display: flex; align-items: baseline; gap: 12px; padding: 9px 16px 6px; background: var(--bg); border-bottom: 1px solid var(--line2); border-top: 1px solid var(--line2); }
.ghrow .gh-name { font-weight: 600; font-size: 13px; } .ghrow .gh-name:hover { text-decoration: underline; }
.ghrow .gh-sum { font-size: 11.5px; color: var(--muted); }
.trow { padding: 7px 16px; border-bottom: 1px solid var(--line2); }
.trow:hover { background: var(--hi); }
.trow.sel { background: var(--sel); }
.tname { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tname .vn { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tname .vn:hover { text-decoration: underline; }
.tname .ln { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.tname .ln > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segchip { flex: none; font-size: 11px; color: var(--accent); padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; }
.tier-wrap { position: relative; justify-self: start; }
.tier-wrap .pill { cursor: help; }
.popover { position: absolute; top: 26px; left: 0; z-index: 20; width: 264px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-pop); padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; }
.popover .ttl { font-weight: 600; margin-bottom: 2px; }
.popover .chk { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: baseline; }
.popover .chk .mk { font-weight: 700; } .popover .chk .mk.no { color: var(--attn); }
.popover .chk .val { font-family: var(--mono); color: var(--muted); }
.popover .ft { color: var(--muted); font-size: 10.5px; border-top: 1px solid var(--line2); padding-top: 6px; margin-top: 2px; text-wrap: pretty; }
.treads { font-family: var(--mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.tab-col { display: flex; flex-direction: column; gap: 3px; }
.tab-col .v { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tab-col .bar { height: 5px; background: var(--line2); border-radius: 3px; overflow: hidden; display: block; }
.tab-col .bar i { display: block; height: 100%; border-radius: 3px; background: var(--abund); }
.tcov { display: flex; align-items: center; gap: 8px; }
.tcov svg { flex: none; display: block; }
.tcov .pct { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tid { font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 1px; }
.tid .k { color: var(--muted); }
.tid .cons { display: flex; gap: 6px; align-items: center; }
.tgv { font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tgv .hall { color: var(--muted); font-family: var(--sans); font-size: 11px; }
.srow { padding: 4px 16px 4px 40px; border-bottom: 1px solid var(--line2); background: var(--bg); font-size: 12px; }
.srow .sl { display: flex; gap: 10px; align-items: baseline; }
.srow .sl .lab { font-family: var(--mono); font-weight: 600; }
.srow .sl .acc { font-family: var(--mono); color: var(--muted); font-size: 11px; }
.srow .mono { font-family: var(--mono); }
.srow .r { text-align: right; }
.grp-more { display: block; padding: 6px 16px 8px 16px; font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--line2); width: 100%; }
.more-groups { display: block; padding: 12px 16px; font-size: 12.5px; color: var(--accent); width: 100%; }

/* ---- taxonomy / heatmap */
.toolbar2 { flex-basis: 100%; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel); }
.toolbar2 .hint { color: var(--muted); font-size: 11.5px; margin-left: auto; }
.toolbar2 input[type=range] { width: 120px; accent-color: var(--fg); }
.rot-lbl { font-family: var(--mono); font-size: 11.5px; color: var(--fg); width: 34px; }
.figbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.figbox.scroll { overflow: auto; }
.fig { width: 100%; min-height: 560px; }
#heat-fig { min-height: 400px; }
.svgtip { position: absolute; pointer-events: none; z-index: 5; max-width: 280px; background: var(--fg); color: var(--bg); padding: 8px 10px; border-radius: 6px; font-size: 11.5px; line-height: 1.4; box-shadow: var(--shadow-tip); }
.svgtip .rr { display: flex; gap: 8px; }
.svgtip .rr .rk { opacity: .6; width: 62px; text-transform: uppercase; font-size: 9.5px; letter-spacing: .05em; padding-top: 2px; flex: none; }
.svgtip .mini { margin-top: 6px; border-top: 1px solid rgba(255,255,255,.2); padding-top: 6px; display: grid; grid-template-columns: auto auto auto auto; gap: 2px 10px; font-family: var(--mono); font-size: 10.5px; }
.svgtip .mini .h { opacity: .6; }
.foot { font-size: 11.5px; color: var(--muted); margin-top: 8px; text-wrap: pretty; }
.ramp { width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--seq-lo), var(--seq-hi)); display: inline-block; }
.typeleg { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.typeleg i { display: inline-block; width: 12px; height: 6px; }
.colors { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 14px; }
.colors-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.colors-head .t { font-weight: 600; font-size: 13.5px; }
.colors-head .s { font-size: 11.5px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
.chip:hover { border-color: var(--fg); }
.chip.on { border-color: var(--fg); font-weight: 600; }
.chip .sw { display: flex; gap: 1px; } .chip .sw i { display: block; width: 9px; height: 14px; }
.famgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px 18px; }
.famrow { display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
.famrow .top { display: flex; align-items: center; gap: 9px; }
.famrow .swb { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line); flex: none; }
.famrow .swb.on { border-color: var(--fg); }
.famrow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.famrow .nm span { color: var(--muted); font-size: 11px; }
.famrow .note { font-size: 10.5px; color: var(--muted); }
.famrow .hex { width: 78px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font-family: var(--mono); font-size: 11.5px; outline: none; }
.famrow .sws { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 0 4px 31px; }
.famrow .sws button.s { width: 18px; height: 18px; border-radius: 4px; outline: 2px solid transparent; outline-offset: 1px; }
.famrow .sws button.s.on { outline-color: var(--fg); }
.famrow .sws label { display: flex; align-items: center; gap: 5px; margin-left: 6px; font-size: 11px; color: var(--muted); }
.famrow .sws input[type=color] { width: 26px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.famrow .sws .def { margin-left: auto; font-size: 11px; color: var(--accent); }
.cursor-rotate { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 4a8 8 0 1 1-7.4 5' fill='none' stroke='black' stroke-width='2.2'/><path d='M4 3v6h6' fill='none' stroke='black' stroke-width='2.2'/></svg>") 12 12, grab; }
.cursor-grab { cursor: grab; } .cursor-grabbing { cursor: grabbing; } .cursor-cross { cursor: crosshair; }

/* ---- drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow-drawer); z-index: 50; overflow: auto; padding: 22px 26px 40px; display: flex; flex-direction: column; gap: 16px; animation: fadein .18s ease-out; font-size: 13px; }
@keyframes fadein { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.dr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dr-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.dr-title { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.15; }
.dr-x { font-size: 20px; line-height: 1; color: var(--muted); padding: 4px 8px; } .dr-x:hover { color: var(--fg); }
.lineage { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11.5px; }
.lchip { display: flex; align-items: baseline; gap: 4px; padding: 2px 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line2); }
.lchip .rk { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
.dr-in { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dr-in .lbl { font-size: 11.5px; color: var(--muted); margin-right: 4px; }
.schip { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.schip.on { border-color: var(--fg); background: var(--sel); }
.schip .nm { font-family: var(--mono); font-size: 11.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--bg); border-radius: 6px; }
.tile .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.tile .v.attn { color: var(--attn); }
.tile .s { font-size: 11px; color: var(--muted); }
.gvstrip { display: flex; gap: 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 8px; font-size: 12px; }
.gvstrip .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; flex: none; }
.gvstrip .v { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.gvstrip .bar { height: 6px; flex: 1; background: var(--line2); border-radius: 3px; overflow: hidden; }
.gvstrip .bar i { display: block; height: 100%; background: var(--fg); }
.gvstrip .t { color: var(--muted); }
.dr-cov { display: flex; justify-content: space-between; align-items: baseline; }
.dr-cov .t { font-weight: 600; font-size: 13.5px; }
.gen { display: grid; gap: 14px; }
.dr-note { font-size: 11.5px; color: var(--muted); }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="hdr-text">
      <div class="kicker" id="kicker"></div>
      <div class="headline" id="headline"></div>
      <div class="subline" id="subline"></div>
    </div>
    <div class="hdr-actions">
      <button class="btn" id="btn-export-all" type="button">Export detections (TSV)</button>
      <button class="textact" id="btn-theme" type="button" title="Switch between light and dark">Theme</button>
    </div>
  </header>
  <div class="body">
    <aside class="focus" id="focus" aria-label="Focus"></aside>
    <main class="main">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tabrow">
        <div class="tabdesc" id="tabdesc"></div>
        <div class="focusline" id="focusline"></div>
      </div>

      <section class="view" id="view-overview" hidden>
        <div id="ov-bar"></div>
        <div id="ov-samples"></div>
        <div id="ov-shared"></div>
      </section>

      <section class="view" id="view-table" hidden>
        <div id="tbl-bar" class="toolbar"></div>
        <div id="tbl-wrap"></div>
      </section>

      <section class="view" id="view-tree" hidden>
        <div id="tree-bar"></div>
        <div id="tree-colors"></div>
        <div class="figbox" id="tree-box">
          <div class="fig" id="tree-fig"></div>
          <div class="svgtip" id="tree-tip" hidden></div>
        </div>
        <div class="foot" id="tree-foot"></div>
      </section>

      <section class="view" id="view-heat" hidden>
        <div id="heat-bar"></div>
        <div class="figbox scroll" id="heat-box">
          <div class="fig" id="heat-fig"></div>
          <div class="svgtip" id="heat-tip" hidden></div>
        </div>
      </section>
    </main>
  </div>
</div>
<div id="drawer-root"></div>
<div id="popover-root"></div>

<script>
// ---- 00_core.js
/* mgviz report — core: data derivation, shared focus state, focus panel, tabs, helpers.

// ---------- number formats (README §Number formats)
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
const fmtI = n => Math.round(n).toLocaleString('en-US');
const fmtR = n => n >= 1000 ? fmt(n) : n >= 10 ? n.toFixed(0) : n.toFixed(1);
const fmtPct = p => (Math.abs(p - Math.round(p)) < 0.05 ? String(Math.round(p)) : p.toFixed(1)) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- confidence tier (README §Derived data). geNomad "not run" passes that check.
function tierOf(d) {
  const gvOk = d.gv == null ? true : d.gv >= 0.8;
  return (d.pct >= 80 && d.reads >= 500 && gvOk && d.rid >= 90) ? 3 : (d.pct >= 40 && d.reads >= 50) ? 2 : d.reads >= 10 ? 1 : 0;
}

// ---------- family palettes: mgviz default + every ltc palette with at least 6 colours
const PALS = (() => {
  const out = {};
  const src = META.palettes || {};
  if (src.mgviz) out.mgviz = src.mgviz.colors.slice(0, 8);
  else out.mgviz = ['#2f6db5', '#d9822b', '#3a9a6e', '#c2457a', '#7b63b8', '#a69b22', '#cf5a3c', '#4b9fc6'];
  Object.keys(src).forEach(k => { if (k !== 'mgviz' && src[k].colors && src[k].colors.length >= 6) out[k] = src[k].colors.slice(0, 8); });
  return out;
})();

// ---------- derived data
function stripAdj(name) { return String(name || '').replace(/\s*\[tax adj:[^\]]*\]\s*$/, ''); }
function segKey(label) { const n = parseInt(label, 10); return isNaN(n) ? [1, String(label)] : [0, n]; }

function derive() {
  const samples = RAW.samples.map(s => ({
    name: s.id, type: s.type || 'sample', raw: s.raw_reads ?? s.filtered_reads ?? 0,

  }));

    const vid = c.assembly || c.accession;
    const key = c.sample + '|' + vid;
    if (!groups.has(key)) groups.set(key, { sample: c.sample, vid, rows: [] });
    groups.get(key).rows.push(c);
  });
  groups.forEach(g => {
    const rows = g.rows.slice().sort((a, b) => { const ka = segKey(a.segment), kb = segKey(b.segment); return ka[0] - kb[0] || (ka[1] > kb[1] ? 1 : ka[1] < kb[1] ? -1 : 0); });

    let v = vmap[g.vid];
    if (!v) {

      v = vmap[g.vid] = {
        id: g.vid, n: stripAdj(ex.name) || ex.accession, acc: rows[0].accession, f: ex.family || 'Unclassified', g: ex.genus || '',
        sp: ex.species || '', strain: unc(ex.subspecies), order: ex.order || '', phylum: ex.phylum || '', tclass: ex.tclass || '',
        len: ex.asm_length || rows.reduce((a, r) => a + (r.length || 0), 0),
        segs: rows.map(r => ({ label: r.segment == null ? '' : String(r.segment), len: r.length, acc: r.accession })),
        det: {}, nS: 0, tot: 0,
      };
    }
    const smp = smap[g.sample];
    const reads = rows.reduce((a, r) => a + (r.reads || 0), 0);
    const len = rows.reduce((a, r) => a + (r.length || 0), 0) || v.len;
    const covered = rows.reduce((a, r) => a + (r.covered || 0), 0);
    const wmean = (k, w) => { let s = 0, ws = 0; rows.forEach(r => { if (r[k] != null) { s += r[k] * (w(r) || 0); ws += (w(r) || 0); } }); return ws ? s / ws : null; };
    const gvRaw = ex.gv_score;
    const gv = gvRaw != null ? gvRaw : (smp && smp.hasGv ? 0 : null);
    const rid = wmean('read_id', r => r.reads);

      sample: g.sample, virus: v, reads, len, pct: Math.round(clamp(covered / len * 100, 0, 100) * 10) / 10,
      rid: rid == null ? 0 : rid * 100, cid: ex.cons_id == null ? null : ex.cons_id * 100,
      gv, hall: rows.reduce((a, r) => a + (r.gv_hallmarks || 0), 0), gvTax: ex.gv_tax || null,
      meanCov: wmean('mean_cov', r => r.length) || 0, pi: ex.pi == null ? null : ex.pi,
      nfrac: wmean('consensus_n_frac', r => r.length),
      rpkmf: smp && smp.filtered ? reads / (len / 1000) / (smp.filtered / 1e6) : (ex.rpkmf || 0),
      adj: rows.some(r => r.adj),
      segs: rows.map(r => ({ label: r.segment == null ? '' : String(r.segment), len: r.length, acc: r.accession, reads: r.reads || 0,
        pct: Math.round(clamp((r.covered || 0) / (r.length || 1) * 100, 0, 100) * 10) / 10, meanCov: r.mean_cov || 0,

  const famTot = {};
  viruses.forEach(v => { famTot[v.f] = (famTot[v.f] || 0) + v.tot; });
  const famOrder = Object.keys(famTot).sort((a, b) => famTot[b] - famTot[a] || a.localeCompare(b));
  const dets = viruses.flatMap(v => Object.values(v.det));
  const maxRpkmf = Math.max(1e-9, ...dets.map(d => d.rpkmf));
  const maxReads = Math.max(1, ...dets.map(d => d.reads));
  const hasGv = samples.some(s => s.hasGv);
  const types = SAMPLE_TYPES.filter(t => samples.some(s => s.type === t)).concat([...new Set(samples.map(s => s.type))].filter(t => !SAMPLE_TYPES.includes(t)).sort());
  // host range (CHECK SOURCE)
  const HR = META.host_range || { rules: [], human_sample_types: [], flag_hosts: [], plant_flag_outside: [] };
  const rules = (HR.rules || []).map(r => ({ host: r.host, re: new RegExp(r.pattern, 'i') }));
  viruses.forEach(v => { const txt = [v.n, v.sp, v.g, v.f].join(' | '); const r = rules.find(x => x.re.test(txt)); v.host = r ? r.host : 'human'; });

}
const D = derive();

// Flags (README §Flags): rare, a few % of calls.
function flagOf(d) {
  const v = d.virus;
  if (d.adj && d.tier >= 1) return ['DIVERGENT', 'Consensus identity ' + (d.cid == null ? '?' : d.cid.toFixed(1)) + '% is below the species threshold: possibly a new variant'];
  if (d.pct >= 60 && d.gv != null && d.gv < 0.6) return ['LOW GENOMAD', 'geNomad score ' + d.gv.toFixed(2) + ' despite ' + fmtPct(d.pct) + ' coverage: check that this is really viral'];
  const st = D.smap[d.sample] ? D.smap[d.sample].type : '';
  const human = (D.HR.human_sample_types || []).includes(st);
  if (d.tier >= 2 && human) {
    if ((D.HR.flag_hosts || []).includes(v.host)) return ['CHECK SOURCE', 'Animal virus in a human sample: dietary or reagent contamination?'];
    if (v.host === 'plant' && !(D.HR.plant_flag_outside || []).includes(st)) return ['CHECK SOURCE', 'Plant virus in a ' + st + ' sample: dietary or reagent contamination?'];
  }
  return null;
}
const abund = d => Math.log10(d.rpkmf + 1) / Math.log10(D.maxRpkmf + 1);

// ---------- state
const S = {
  tab: 'overview', selSample: null, selFamily: null, search: '', minTier: 0, selVirus: null,
  sampleQ: '', samplesOpen: null, famsOpen: false, typeOpen: {},
  treeLayout: 'rect', treeValue: 'rpkmf', treeCols: 'auto', collapsed: null, treeRot: 0, treeTool: null, zoomFam: '',
  compTop: 'auto', compSort: 'type', heatTop: 'auto', heatCols: 'cluster',
  groupBy: 'auto', groupLimit: 20, groupOpen: {}, expanded: {}, sortKey: 'rpkmf', sortDir: -1, flagOnly: false, sharedOnly: false, tierKey: null,
  ovQ: '', ovSort: 'viral', ovLimit: 20,
  compare: false, drawerSample: null, drawerAll: false, famColors: {}, paletteSel: null, colorOpen: false, colorEdit: null, hexDrafts: {}, theme: null,
};
try { const sv = JSON.parse(localStorage.getItem('mgviz.colors') || 'null'); if (sv) { S.famColors = sv.fc || {}; S.paletteSel = sv.ps || null; } } catch (e) { /* storage unavailable */ }
try { const t = localStorage.getItem('mgviz.theme'); if (t === 'light' || t === 'dark') S.theme = t; } catch (e) { /* storage unavailable */ }
function saveColors() { try { localStorage.setItem('mgviz.colors', JSON.stringify({ fc: S.famColors, ps: S.paletteSel })); } catch (e) { /* ignore */ } }
function applyTheme() {
  const root = document.documentElement;
  if (S.theme) root.setAttribute('data-theme', S.theme); else root.removeAttribute('data-theme');
  try { if (S.theme) localStorage.setItem('mgviz.theme', S.theme); else localStorage.removeItem('mgviz.theme'); } catch (e) { /* ignore */ }
}
function isDark() { return S.theme === 'dark' || (!S.theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }

// theme values for SVG (literal colours, so exports carry them)
function tv() {
  const dark = isDark();
  return dark
    ? { dark, bg: '#1b1f1d', fg: '#e4e6e0', muted: '#99a19b', line: '#2e3431', line2: '#242927', faint: '#242927', absent: '#222725', seq: ['#263645', '#a9d6ff'], grey: '#6b7370', ink: '#c9cdc6', attn: '#f0957a', abund: '#8ec0e4', accent: '#8ec0e4' }
    : { dark, bg: '#ffffff', fg: '#1c201e', muted: '#636a66', line: '#d9dcd4', line2: '#eceee7', faint: '#eef0ea', absent: '#f0f1ec', seq: ['#dde6ee', '#0e3a62'], grey: '#a3a8a4', ink: '#3b4440', attn: '#a84f2b', abund: '#2b5d86', accent: '#1f5f8b' };
}
// sequential ramp: RGB with gamma 1.8, pure JS (works without d3), clamped to [0,1]
function seq() {
  const t = tv(); const p = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16)); const a = p(t.seq[0]), b = p(t.seq[1]);
  const g = 1.8, L = x => Math.pow(x / 255, g), U = x => Math.round(255 * Math.pow(x, 1 / g));
  return v => { const f = clamp(+v || 0, 0, 1); return '#' + a.map((x, k) => U(L(x) + (L(b[k]) - L(x)) * f).toString(16).padStart(2, '0')).join(''); };
}
function inkOn(bg) {
  const c = [1, 3, 5].map(k => parseInt(bg.slice(k, k + 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4));

}
function famColor(f) {
  const o = S.famColors && S.famColors[f]; if (o) return o;
  const pal = PALS[S.paletteSel] || PALS.mgviz; const i = D.famOrder.indexOf(f);
  if (!(i >= 0 && i < pal.length)) return tv().grey;
  let c = pal[i]; if (isDark() && window.d3) c = d3.color(c).brighter(0.7).formatHex(); return c;
}
function famLabelColor(f) { const c = famColor(f); return c === tv().grey ? tv().muted : c; }
function typeShades() { return isDark() ? ['#e4e6e0', '#a3a9a3', '#6b7370', '#3a403d'] : ['#2b302d', '#7d847f', '#b4b9b3', '#dfe2db']; }

// ---------- focus helpers
const confMin = () => Math.max(2, S.minTier);
function matchQ(v, q) { return !q || v.n.toLowerCase().includes(q) || v.f.toLowerCase().includes(q) || v.g.toLowerCase().includes(q) || (v.acc || '').toLowerCase().includes(q); }
function matchV(v) {

}

  const q = S.search.trim().toLowerCase();
  return D.dets.filter(d => { const v = d.virus; return (!S.selSample || d.sample === S.selSample) && (!S.selFamily || v.f === S.selFamily) && matchQ(v, q) && d.tier >= S.minTier && (!S.sharedOnly || v.nS >= 2); });
}

// ---------- tooltip (figures)
function showTip(tipEl, html, ev, container) {
  if (!tipEl) return; tipEl.hidden = false; tipEl.innerHTML = html;
  const r = container.getBoundingClientRect(); let x = ev.clientX - r.left + 14 + container.scrollLeft, y = ev.clientY - r.top + 14 + container.scrollTop;
  if (x + 290 > r.width + container.scrollLeft) x = ev.clientX - r.left - 294 + container.scrollLeft;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip(tipEl) { if (tipEl) tipEl.hidden = true; }
function rankRow(r, n, b) { return `<div class="rr"><span class="rk">${esc(r)}</span><span style="font-weight:${b ? 600 : 400}">${esc(n)}</span></div>`; }
function virusTipHtml(v) {

// ---------- sparkline paths (symlog, step)
function spark(covs, w, h) {
  const all = covs.flat(); const max = Math.max(1, d3.max(all) || 0);
  const y = d3.scaleSymlog().domain([0, max]).range([h - 1, 2]); const total = all.length || 1; const x = i => (i / total) * w;
  const fill = d3.area().x((d, i) => x(i)).y0(h).y1(d => y(d)).curve(d3.curveStepAfter)(all);
  const line = d3.line().x((d, i) => x(i)).y(d => y(d)).curve(d3.curveStepAfter)(all);
  let sep = '', acc = 0; covs.slice(0, -1).forEach(c => { acc += c.length; sep += `M${x(acc)},0V${h}`; });
  return { fill: fill || '', line: line || '', sep };
}

VIEWS.overview = {
  render() {
    const N = D.samples.length, many = N > 12, cm = confMin(), sq = seq();
    const q = S.ovQ.trim().toLowerCase();
    const vq = v => !q || v.n.toLowerCase().includes(q) || v.f.toLowerCase().includes(q) || v.g.toLowerCase().includes(q);
    const hit = (v, x) => v.det[x.name] && v.det[x.name].tier >= S.minTier;
    const typesPresent = D.types;
    const ovSamples = (S.selSample ? D.samples.filter(x => x.name === S.selSample) : D.samples);
    // ---- per-sample rows (cards or glance table)
    const sRows = ovSamples.map(x => {
      const sd = D.dets.filter(d => d.sample === x.name && matchV(d.virus)).sort((a, b) => b.rpkmf - a.rpkmf);
      const conf = sd.filter(d => d.tier >= cm), rest = sd.filter(d => d.tier < cm);
      const sMatch = !q || x.name.toLowerCase().includes(q) || x.type.includes(q);
      const vm = q && !sMatch ? conf.filter(d => vq(d.virus)) : [];
      return { x, sd, conf, rest, keep: sMatch || vm.length > 0, vm, frac: x.filtered ? x.mapped / x.filtered : 0 };
    }).filter(r => r.keep);
    // ---- prevalence / shared
    const pv0 = D.viruses.filter(v => matchV(v) && (vq(v) || D.samples.some(x => v.det[x.name] && (x.name.toLowerCase().includes(q) || x.type.includes(q)))))
      .map(v => ({ v, k: D.samples.filter(x => hit(v, x)).length })).filter(e => e.k >= (many ? 1 : 2)).sort((a, b) => b.k - a.k || b.v.tot - a.v.tot);
    const pv = pv0.slice(0, many ? 15 : 14);
    this._export = { sRows, pv0, typesPresent, q };
    // ---- search bar
    let h = `<div class="ov-bar"><div class="ov-search"><input id="in-ovq" data-act="ovq" value="${esc(S.ovQ)}" placeholder="Search samples, sample types or viruses (e.g. stool_S1, nasal, norovirus, Coronaviridae)">${q ? '<button class="x" data-act="ovq-clear" title="Clear search">×</button>' : ''}</div>
      <span class="ov-note">${q ? `${sRows.length} of ${N} samples match` : ''}</span>

        const qc = [fmt(x.raw) + ' raw', fmt(x.filtered) + ' non-host', fmt(x.mapped) + ' viral reads'];

      <div class="dr-in"><span class="lbl">Detected in</span>${(S.drawerAll || dets.length <= 12 ? dets : dets.slice(0, 12).concat(dets.find(x => x.sample === d.sample) && dets.indexOf(dets.find(x => x.sample === d.sample)) >= 12 ? [dets.find(x => x.sample === d.sample)] : [])).map(x => `<button class="schip${x.sample === d.sample ? ' on' : ''}" data-act="drawer-sample" data-k="${esc(x.sample)}"><span class="nm">${esc(x.sample)}</span>${pillHtml(x.tier, 'xs')}</button>`).join('')}${dets.length > 12 ? `<button class="textact" data-act="drawer-all">${S.drawerAll ? 'Show fewer' : `+${dets.length - 12} more`}</button>` : ''}${v.nS > 1 ? `<button class="btn sm${S.compare ? ' on' : ''}" data-act="drawer-compare" style="margin-left:auto">Compare samples</button>` : ''}</div>

      <div class="dr-cov"><div class="t">${multi ? `Coverage and ORFs per segment · ${esc(d.sample)}` : `Coverage and ORFs · ${esc(d.sample)}`}</div><span class="exports"><button data-act="drawer-ex" data-f="svg">SVG</button><button data-act="drawer-ex" data-f="png">PNG</button></span></div>
      <div class="gen" id="gen" style="grid-template-columns:${multi ? 'repeat(auto-fill,minmax(250px,1fr))' : '1fr'}"></div>

  draw(v, det, dets) {

    const pal = PALS[S.paletteSel] || PALS.mgviz; const sColor = i => isDark() ? d3.color(pal[(i + 2) % pal.length]).brighter(.7).formatHex() : pal[(i + 2) % pal.length];

      const covH = multi ? 70 : 140, orfH = multi ? 26 : 34, axH = 22, top = multi ? 18 : 8; const H = top + covH + 8 + orfH + axH;
      const svg = wrap.append('svg').attr('class', 'fig-svg').attr('width', W).attr('height', H).attr('viewBox', [0, 0, W, H]).attr('font-family', '-apple-system, Segoe UI, system-ui, Helvetica, sans-serif').style('display', 'block'); svg.append('rect').attr('width', W).attr('height', H).attr('fill', t.bg);
      const ml = multi ? 30 : 40, mr = 8; const x = d3.scaleLinear().domain([0, sg.len]).range([ml, W - mr]);
      const covOf = d => (d.segs[si] || sg).cov; const maxD = compare ? d3.max(dets, d => d3.max(covOf(d))) : d3.max(sg.cov); const y = d3.scaleSymlog().domain([0, Math.max(10, (maxD || 0) * 1.1)]).range([top + covH, top]);
      if (multi) svg.append('text').attr('x', ml).attr('y', 11).attr('font-size', 11).attr('font-weight', 600).attr('fill', t.fg).text(sg.label || sg.acc).append('tspan').attr('fill', t.muted).attr('font-weight', 400).text(`  ${fmtI(sg.len)} bp · ${fmt(sg.reads)} reads · ${fmtPct(sg.pct)}`);
      const yAx = d3.axisLeft(y).ticks(multi ? 3 : 5, '~s').tickSize(-(W - ml - mr)); svg.append('g').attr('transform', `translate(${ml},0)`).call(yAx).call(g => { g.select('.domain').remove(); g.selectAll('.tick line').attr('stroke', t.faint); g.selectAll('.tick text').attr('fill', t.muted).attr('font-size', 9.5); });

      if (compare) dets.forEach((d, i) => svg.append('path').datum(covOf(d)).attr('d', line).attr('fill', 'none').attr('stroke', sColor(i)).attr('stroke-width', 1.5).attr('opacity', .9));
      else { svg.append('path').datum(sg.cov).attr('d', area).attr('fill', col).attr('opacity', .22); svg.append('path').datum(sg.cov).attr('d', line).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 1.4);
        sg.cov.forEach((c, i) => { if (c === 0) svg.append('rect').attr('x', x(i * sg.len / n)).attr('y', top + covH - 3).attr('width', Math.max(1, x(sg.len / n) - x(0))).attr('height', 3).attr('fill', t.attn); }); }
      const oy = top + covH + 8; svg.append('line').attr('x1', ml).attr('x2', W - mr).attr('y1', oy + orfH / 2).attr('y2', oy + orfH / 2).attr('stroke', t.line); const ah = multi ? 9 : 12;

        const [st, en, strand, , partial] = o; const fwd = strand !== '-' && strand !== -1; const name = `ORF${k + 1}`;
        const x0 = x(st), x1 = x(en), w = x1 - x0; const yy = fwd ? oy + orfH / 2 - ah - 1 : oy + orfH / 2 + 1; const head = Math.min(6, w * 0.4);
        const pts = fwd ? [[x0, yy], [x1 - head, yy], [x1, yy + ah / 2], [x1 - head, yy + ah], [x0, yy + ah]] : [[x1, yy], [x0 + head, yy], [x0, yy + ah / 2], [x0 + head, yy + ah], [x1, yy + ah]];

        if (w > name.length * (multi ? 5.2 : 6.2) + 8) svg.append('text').attr('x', (x0 + x1) / 2).attr('y', yy + ah / 2).attr('dy', '0.35em').attr('text-anchor', 'middle').attr('font-size', multi ? 8.5 : 10).attr('font-weight', 600).attr('fill', t.bg).attr('pointer-events', 'none').text(name);
      });
      svg.append('text').attr('x', ml - 4).attr('y', oy + orfH / 2 - ah / 2 - 1).attr('dy', '0.35em').attr('text-anchor', 'end').attr('font-size', 8.5).attr('fill', t.muted).text('+'); svg.append('text').attr('x', ml - 4).attr('y', oy + orfH / 2 + ah / 2 + 1).attr('dy', '0.35em').attr('text-anchor', 'end').attr('font-size', 8.5).attr('fill', t.muted).text('−');
      const xAx = d3.axisBottom(x).ticks(multi ? 3 : 7).tickFormat(d => d >= 1000 ? (d / 1000).toFixed(d % 1000 ? 1 : 0) + ' kb' : d + ' bp').tickSize(3); svg.append('g').attr('transform', `translate(0,${oy + orfH + 2})`).call(xAx).call(g => { g.select('.domain').attr('stroke', t.line); g.selectAll('.tick line').attr('stroke', t.line); g.selectAll('.tick text').attr('fill', t.muted).attr('font-size', 9.5); });
    });
  },
};
Object.assign(ACTIONS, {
  'drawer-close': () => setState({ selVirus: null, compare: false, drawerSample: null, drawerAll: false }),
  'drawer-all': () => setState({ drawerAll: !S.drawerAll }),
  'drawer-sample': d => setState({ drawerSample: d.k }),
  'drawer-compare': () => setState({ compare: !S.compare }),

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.selVirus) ACTIONS['drawer-close'](); });

// ---- 60_export.js
/* mgviz report — exports: CSV/TSV tables, SVG/PNG figures. All rows in the current focus, never only the visible ones. */
const EXPORT = {
  download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  rows(rows, name, kind) {
    if (kind === 'csv') {
      const escCsv = v => { const x = v == null ? '' : String(v); return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
      const txt = '﻿' + rows.map(r => r.map(escCsv).join(',')).join('\r\n');
      this.download(new Blob([txt], { type: 'text/csv;charset=utf-8' }), name + '.csv');
    } else {
      const clean = v => (v == null ? '' : String(v)).replace(/[\t\r\n]+/g, ' ');
      const txt = rows.map(r => r.map(clean).join('\t')).join('\n');
      this.download(new Blob([txt], { type: 'text/tab-separated-values;charset=utf-8' }), name + '.tsv');
    }
  },
  detectionRows(dets) {
    const r = [['sample', 'virus', 'family', 'genus', 'species', 'accession', 'segments', 'length', 'reads', 'rpkmf', 'pct_covered', 'mean_depth', 'read_identity', 'consensus_identity', 'pi', 'genomad_score', 'hallmarks', 'confidence', 'taxonomy_adjusted']];
    dets.forEach(d => { const v = d.virus; r.push([d.sample, v.n, v.f, v.g, v.sp, v.acc, v.segs.length, d.len, d.reads, d.rpkmf.toFixed(3), d.pct, d.meanCov.toFixed(2), d.rid.toFixed(2), d.cid == null ? '' : d.cid.toFixed(2), d.pi == null ? '' : d.pi, d.gv == null ? '' : d.gv.toFixed(3), d.hall, TIERS[d.tier], d.adj]); });
    return r;
  },
  detectionsTsv() { this.rows(this.detectionRows(filteredDets()), 'mgviz_detections' + focusTag(), 'tsv'); },
  svgString(svg) {
    const c = svg.cloneNode(true); c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    if (!c.getAttribute('font-family')) c.setAttribute('font-family', '-apple-system, "Segoe UI", system-ui, Helvetica, sans-serif');
    if (!c.getAttribute('width')) { const vb = (c.getAttribute('viewBox') || '0 0 800 600').split(/[\s,]+/); c.setAttribute('width', vb[2]); c.setAttribute('height', vb[3]); }
    return new XMLSerializer().serializeToString(c);
  },
  stack(svgs) {
    // several SVG panels into one, stacked vertically, with the panel background
    const t = tv(); const ns = 'http://www.w3.org/2000/svg';
    const dims = svgs.map(s => { const vb = (s.getAttribute('viewBox') || `0 0 ${s.clientWidth || 800} ${s.clientHeight || 600}`).split(/[\s,]+/).map(Number); return { w: vb[2], h: vb[3] }; });
    const W = Math.max(...dims.map(d => d.w)), H = dims.reduce((a, d) => a + d.h + 16, 0);
    const out = document.createElementNS(ns, 'svg'); out.setAttribute('viewBox', `0 0 ${W} ${H}`); out.setAttribute('width', W); out.setAttribute('height', H);
    const bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', W); bg.setAttribute('height', H); bg.setAttribute('fill', t.bg); out.appendChild(bg);
    let y = 0; svgs.forEach((s, i) => { const g = document.createElementNS(ns, 'g'); g.setAttribute('transform', `translate(0,${y})`); Array.from(s.cloneNode(true).childNodes).forEach(n => g.appendChild(n)); out.appendChild(g); y += dims[i].h + 16; });
    return out;
  },
  fig(container, name, kind, scale) {
    if (!container) return; const svgs = $$('svg.fig-svg', container); if (!svgs.length) return;
    const svg = svgs.length === 1 ? svgs[0] : this.stack(svgs);
    this.svgEl(svg, name, kind, scale);
  },
  svgEl(svg, name, kind, scale) {
    const str = this.svgString(svg);
    if (kind === 'svg') { this.download(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }), name + '.svg'); return; }
    const vb = (svg.getAttribute('viewBox') || `0 0 ${svg.getAttribute('width')} ${svg.getAttribute('height')}`).split(/[\s,]+/).map(Number);
    const k = scale || 3, w = vb[2], h = vb[3]; const img = new Image();
    // a data URI never taints the canvas (a blob: URL does on file:// pages)
    img.onload = () => {

      ctx.fillStyle = tv().bg; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { if (b) this.download(b, name + '.png'); else console.error('PNG export failed: canvas could not be read'); }, 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  },
  // export-only SVG table (for Overview panels): cols = [{label, w, align}], rows = [[cell…]], cell = string | {text, bg, fg, bar}
  tableSvg(title, sub, cols, rows, opts) {
    const t = tv(); const ns = 'http://www.w3.org/2000/svg'; const o = Object.assign({ rowH: 22, pad: 18, font: 11.5 }, opts || {});
    const W = o.pad * 2 + cols.reduce((a, c) => a + c.w + 14, -14); const H = o.pad * 2 + 44 + (sub ? 20 : 0) + 24 + rows.length * o.rowH;
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('class', 'fig-svg'); svg.setAttribute('font-family', '-apple-system, "Segoe UI", system-ui, Helvetica, sans-serif');

    add('rect', { width: W, height: H, fill: t.bg });

    if (sub) { y += 20; add('text', { x: o.pad, y, 'font-size': 11, fill: t.muted }, sub); }
    y += 24; let x = o.pad;
    cols.forEach(c => { add('text', { x: c.align === 'right' ? x + c.w : x, y, 'font-size': 10, fill: t.muted, 'text-anchor': c.align === 'right' ? 'end' : 'start', 'letter-spacing': '.05em' }, String(c.label).toUpperCase()); x += c.w + 14; });
    add('line', { x1: o.pad, x2: W - o.pad, y1: y + 6, y2: y + 6, stroke: t.line });
    y += 8;

        if (v.bg) { add('rect', { x: cx, y: cy - 8, width: c.w, height: 16, rx: 3, fill: v.bg }); add('text', { x: cx + c.w / 2, y: cy + 3.5, 'font-size': 9.5, 'text-anchor': 'middle', fill: v.fg || t.fg, 'font-family': 'ui-monospace, Menlo, monospace' }, v.text || ''); }
        else if (v.bar != null) { add('rect', { x: cx, y: cy - 3, width: 100, height: 6, rx: 3, fill: t.line2 }); add('rect', { x: cx, y: cy - 3, width: Math.max(1, v.bar), height: 6, rx: 3, fill: t.fg, opacity: .7 }); add('text', { x: cx + 108, y: cy + 3.5, 'font-size': o.font, fill: t.fg, 'font-family': 'ui-monospace, Menlo, monospace' }, v.text || ''); }
        else add('text', { x: c.align === 'right' ? cx + c.w : cx, y: cy + 4, 'font-size': o.font, fill: v.muted ? t.muted : t.fg, 'text-anchor': c.align === 'right' ? 'end' : 'start', 'font-weight': v.bold ? 600 : 400, 'font-family': v.mono ? 'ui-monospace, Menlo, monospace' : null }, v.text == null ? '' : String(v.text));
        cx += c.w + 14;
      });
      y += o.rowH; add('line', { x1: o.pad, x2: W - o.pad, y1: y, y2: y, stroke: t.line2 });
    });
    return svg;
  },
};
