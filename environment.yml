name: mgviz
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12
  - fastp>=0.24
  - minimap2>=2.28
  - samtools>=1.20
  - pysam>=0.22
  - pyyaml
  - numpy
  - pyrodigal-gv>=0.3   # virus-tuned gene prediction
  - pyhmmer>=0.10       # protein annotation against HMM DBs
  - genomad>=1.11       # neural-net virus/plasmid scoring + marker annotation + ICTV taxonomy
  - pytaxonkit>=0.10   # only for building a custom database
