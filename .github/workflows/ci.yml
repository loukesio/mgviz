name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e . pytest pysam
      - name: Test
        run: pytest -q

  nextflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
      - name: Parse the workflow and every module
        run: |
          cd pipeline
          nextflow config -flat . > /dev/null
          nextflow run main.nf --help > /dev/null 2>&1 || true
          for m in modules/*.nf; do nextflow run "$m" -preview > /dev/null 2>&1 || echo "preview failed for $m (expected without inputs)"; done
