name: Demo report

# Builds the landing page and two demo reports with `mgviz demo` and publishes them to the
# gh-pages branch (https://loukesio.github.io/mgviz/), so the interactive report can be tried
# without installing anything.

on:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml", "docs/site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Build the landing page and the demo reports
        run: |
          mkdir -p site/images
          cp docs/site/index.html site/
          cp docs/images/logo.png docs/images/logo_alive.svg docs/images/*.jpg site/images/
          mgviz demo demo100 -n 100 --seed 11 --run-id "demo, 100 samples" -o site/demo100.html
          mgviz demo demo4 -n 4 --run-id "demo, 4 samples" -o site/demo4.html
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Demo reports from ${{ github.sha }}"
